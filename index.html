<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme (or the system's) before first paint, so chalkboard mode doesn't flash white.
      try {
        var t = localStorage.getItem('hello-class:theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'chalk' : 'paper'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <title>Hello Class · free ESL lesson planner</title>
    <meta name="description" content="Hello Class turns a topic into a timed, CELTA-style ESL lesson plan. Free, offline, no account." />
    <meta name="theme-color" content="#f6efdf" />
    <!-- Link previews (Open Graph / Twitter). Image URLs must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hello Class" />
    <meta property="og:title" content="Hello Class · free ESL lesson planner" />
    <meta property="og:description" content="Turn a topic into a timed, CELTA-style lesson in seconds. Free, works offline, no account." />
    <meta property="og:url" content="https://prestoj01.github.io/teaching-english-planner/" />
    <meta property="og:image" content="https://prestoj01.github.io/teaching-english-planner/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hello Class: turn a topic into a timed, CELTA-style lesson in seconds. An index card shows a lesson outline next to a sticky note." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
